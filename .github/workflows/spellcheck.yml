---
name: Check Spelling

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: streetsidesoftware/cspell-action@v9
        with:
          check_dot_files: false
          incremental_files_only: true
          inline: warning
          strict: false
