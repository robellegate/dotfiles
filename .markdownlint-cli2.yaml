# Config file schema: https://github.com/DavidAnson/markdownlint-cli2/blob/main/schema/markdownlint-cli2-config-schema.json
# Explanation of rules: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

# Disable some built-in rules
config:
  # Default state for all rules
  default: true

  # MD007/ul-indent - Unordered list indentation
  MD007:
    # Number of spaces
    indent: 4

  # MD013/line-length - Line length
  MD013:
    # Number of characters
    line_length: 120
    # Include code blocks
    code_blocks: false
    # Include tables
    tables: false

  # MD024/no-duplicate-heading - Multiple headings with the same content
  MD024:
    # Allow multiple top-level headings
    siblings_only: true

  # MD033/no-inline-html - Inline HTML
  MD033:
    # Allow inline HTML
    allowed_elements: [br, details, meta, summary]

# Fix any fixable errors
fix: true

# Ignore files referenced by .gitignore (only valid at root)
gitignore: true

# Define glob expressions to ignore
ignores:
  - "CLAUDE.md"
  - ".claude/**/*.md"

# Disable banner message on stdout (only valid at root)
noBanner: true

# Disable progress on stdout (only valid at root)
noProgress: true

# Show found files on stdout (only valid at root)
showFound: true
